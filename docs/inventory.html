<body>
  <header>
    <a class="navlink" href="./">← Event Manager</a>
    <span class="version">v0.6</span>
    <div class="brand-row">
      <img src="sbe-logo.png" alt="Simply Beeutiful Events logo" class="brand-logo" />
      <div>
        <h1>Simply Beeutiful Events</h1>
        <p>Inventory</p>
      </div>
    </div>
    <p class="tagline">Every decor and supply item SBE owns, with a photo.</p>
  </header>

  <main>
    <section class="card">
      <div id="driveBar" class="drivebar" hidden></div>
      <div id="invTools" class="row toolbar inv-tools" hidden>
        <button id="btnAddItem" class="primary">+ Add item</button>
        <input id="invSearch" type="search" placeholder="Search items" aria-label="Search items" />
        <select id="invCategory" aria-label="Category"></select>
        <span id="invCount"></span>
      </div>
      <div id="invPanel" class="panel" hidden></div>
      <div class="row"><span id="status"></span></div>
      <div id="invList"></div>
    </section>
  </main>

  <dialog id="invZoom" class="inv-zoom">
    <figure><img alt="" /><figcaption></figcaption></figure>
    <p class="hint">Click anywhere to close.</p>
  </dialog>

  <footer>
    <small>Sign in with Google to see the inventory · Items and photos are saved privately in the shared “SBE App Data” folder</small>
  </footer>

  <script type="module" src="js/inventoryPage.js?v=202610120813"></script>
</body>
</html>
