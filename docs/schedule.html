<body>
  <header>
    <span class="version">v0.6</span>
    <div class="brand-row">
      <img src="sbe-logo.png" alt="Simply Beeutiful Events logo" class="brand-logo" />
      <div>
        <h1>Simply Beeutiful Events</h1>
        <p>Calendar</p>
      </div>
    </div>
    <p class="tagline">Every event, task and payment date, month by month.</p>
    <nav class="sitenav" aria-label="Pages">
      <a href="./">Home</a>
      <a href="events.html">Event Manager</a>
      <a href="schedule.html" aria-current="page">Calendar</a>
      <a href="inventory.html">Inventory</a>
      <a href="todo.html">To Do</a>
      <a href="vendors.html">Vendors</a>
      <a href="calendar.html">Booking page</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <div id="driveBar" class="drivebar" hidden></div>
      <div class="row"><span id="status"></span></div>
    </section>
    <section class="card cal" id="calCard" aria-labelledby="calTitle" hidden>
      <div class="cal-head">
        <button type="button" class="mini" id="calPrev" aria-label="Previous month">‹</button>
        <h2 id="calTitle">Calendar</h2>
        <button type="button" class="mini" id="calNext" aria-label="Next month">›</button>
        <button type="button" class="mini" id="calToday">Today</button>
        <span class="cal-filters" role="group" aria-label="Show">
          <label><input type="checkbox" id="calShowEvent" checked /> <span class="cal-key k-event"></span> Events</label>
          <label><input type="checkbox" id="calShowTask" checked /> <span class="cal-key k-task"></span> Tasks</label>
          <label><input type="checkbox" id="calShowMoney" checked /> <span class="cal-key k-payment"></span> Payments and deadlines</label>
        </span>
      </div>
      <div id="calGrid" class="cal-grid"></div>
      <div id="calAgenda" class="cal-agenda"></div>
    </section>
    <p id="calMsg" class="empty"></p>
  </main>

  <footer>
    <small>Built from what the app keeps in the shared “SBE App Data” folder · Consult calls stay in Google Calendar</small>
  </footer>

  <script type="module" src="js/calendarPage.js?v=202611171257"></script>
</body>
