<body>
  <header>
    <span class="version">v0.6</span>
    <div class="brand-row">
      <img src="sbe-logo.png" alt="Simply Beeutiful Events logo" class="brand-logo" />
      <div>
        <h1>Simply Beeutiful Events</h1>
        <p>To Do</p>
      </div>
    </div>
    <p class="tagline">What needs doing, where each thing stands, and notes along the way.</p>
    <nav class="sitenav" aria-label="Pages">
      <a href="./">Home</a>
      <a href="events.html">Event Manager</a>
      <a href="inventory.html">Inventory</a>
      <a href="todo.html" aria-current="page">To Do</a>
      <a href="calendar.html">Booking page</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <div id="driveBar" class="drivebar" hidden></div>
      <form id="todoAdd" class="todo-add" hidden>
        <input name="title" placeholder="What needs to be done?" aria-label="What needs to be done?" autocomplete="off" maxlength="300" />
        <button type="submit" class="primary">+ Add</button>
      </form>
      <div id="todoTools" class="row toolbar todo-tools" hidden>
        <input id="todoSearch" type="search" placeholder="Search to-dos and notes" aria-label="Search to-dos and notes" />
        <span id="todoCount"></span>
      </div>
      <div class="row"><span id="status"></span></div>
      <div id="todoList"></div>
    </section>
  </main>

  <footer>
    <small>The to-do list is saved privately in the shared “SBE App Data” folder</small>
  </footer>

  <script type="module" src="js/todoPage.js?v=202611070755"></script>
</body>
